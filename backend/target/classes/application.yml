spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cu_campus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true

app:
  jwt:
    secret: ${JWT_SECRET:dev_secret_min_32_chars_aaaaaaaaaaaaaaaaaaaaaa}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

server:
  port: ${PORT:8080}

